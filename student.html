<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Panel — AttendX</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%232563eb%22 stroke-width=%222%22><path d=%22M22 10v6M2 10l10-5 10 5-10 5z%22/><path d=%22M6 12v5c3 3 9 3 12 0v-5%22/></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .student-page {
      max-width: 500px;
      margin: 0 auto;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
    }

    .scan-card {
      text-align: center;
    }

    .scan-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .scan-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    #reader {
      margin-bottom: 1.25rem;
    }

    .student-profile-card {
      margin-bottom: 1.5rem;
      padding: 1.25rem 1.5rem;
    }

    .student-info-bar {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .student-avatar {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.12);
      flex-shrink: 0;
    }

    .student-details {
      flex: 1;
      min-width: 0;
    }

    .student-name-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }

    .student-fullname {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .student-meta-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .student-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .student-meta-item .icon-svg {
      width: 0.95rem;
      height: 0.95rem;
      color: #94a3b8;
    }

    .camera-placeholder {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .camera-placeholder .icon { font-size: 3rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>

<!-- Animated BG -->
<div class="bg-scene">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>



<!-- Navbar -->
<nav class="navbar">
  <div class="logo">
    <svg class="icon-svg" viewBox="0 0 24 24">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
      <path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    <span>AttendX</span>
  </div>
  <div class="nav-user">
    <span id="student-name-display">Student</span>
    <span class="badge badge-primary">Student</span>
    <button class="btn btn-outline" style="padding:0.5rem 1rem;font-size:0.85rem" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="student-page">

  <!-- Student Profile Card -->
  <div class="card student-profile-card">
    <div class="student-info-bar">
      <div class="student-avatar" id="student-avatar">?</div>
      <div class="student-details">
        <div class="student-name-row">
          <div class="student-fullname" id="student-fullname">Loading...</div>
          <span class="badge badge-primary" id="student-branch-badge" style="display:none;font-size:0.75rem;padding:0.2rem 0.6rem"></span>
        </div>
        <div class="student-meta-row">
          <span class="student-meta-item" id="student-id-display">
            <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><line x1="15" y1="8" x2="17" y2="8"/><line x1="15" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="17" y2="16"/></svg>
            <span id="student-roll-text">Roll No: —</span>
          </span>
          <span class="student-meta-item" id="student-college-wrap" style="display:none">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>
            <span id="student-college-text"></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Scanner Card -->
  <div class="card scan-card mt-2">
    <h2 style="display:flex;align-items:center;justify-content:center;gap:0.5rem">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span>Scan QR Code</span>
    </h2>
    <p>Point your camera at the QR displayed in your classroom</p>

    <!-- Camera will render here -->
    <div id="reader"></div>

    <!-- Start/Stop Camera -->
    <button class="btn btn-primary btn-full" id="scan-btn" onclick="startScanner()">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span>Start Camera</span>
    </button>

    <!-- Status message -->
    <div class="scan-status mt-2" id="scan-status"></div>


  </div>

  <!-- Attendance History -->
  <div class="card mt-3">
    <div class="section-title" style="font-size:1.1rem;font-weight:700;margin-bottom:1rem">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>My Attendance History</span>
    </div>
    <div id="history-list">
      <div style="text-align:center;padding:2rem;color:var(--text-muted)">
        No attendance records yet
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/firebase-config.js?v=2"></script>
<script src="js/student.js?v=2"></script>
</body>
</html>
